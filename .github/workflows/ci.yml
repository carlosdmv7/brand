name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older runs on the same branch when new commits land
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + format + tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    # The floor and the newest: consumers range from >=3.11 to 3.13.
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen: fail if uv.lock is out of date instead of silently re-resolving.
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python }}

      # Same commands as `make lint`, `make format-check` and `make test`, so a
      # green `make check` locally means a green PR.
      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
